# CI for the xata-ts-sdk mirror.
#
# Verifies the standalone mirror builds from source using only its committed
# lockfile and packages published to npm. The monorepo's mirror sync regenerates
# pnpm-lock.yaml on every push, so `--frozen-lockfile` here proves the committed
# lockfile stays in sync.
#
# This file lives outside the synced subtree (.github is not mirrored), so it is
# maintained directly in the mirror repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run tsc

      - name: Tests
        run: pnpm run test
